name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (matrix.os == 'ubuntu-latest' && 'mini-linux' || 'mini-macos') || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS' || runner.environment != 'self-hosted'
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        with:
          enable-cache: false
      - name: Set up Python in the build account
        if: runner.os == 'macOS' && runner.environment == 'self-hosted'
        run: |
          uv venv --clear --seed --python ${{ matrix.python }} .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install websockets==16.1.1
      - run: python -m unittest -v
